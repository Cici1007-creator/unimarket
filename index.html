<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniMarket · Vendedores en el campus</title>
<style>
:root{--bg:#F8F9FA;--card:#FFFFFF;--pri:#6C5CE7;--ok:#2ECC71;--warn:#F39C12;--err:#d63031;--tx:#1e2230;--mut:#6b7280;--line:#e8eaf0;--sh:0 2px 10px rgba(30,34,48,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--tx:#eef0f5;--mut:#9aa1b2;--line:#2a2e3b;--sh:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--tx:#eef0f5;--mut:#9aa1b2;--line:#2a2e3b;--sh:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:960px;margin:0 auto;padding:0 14px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{font-weight:800;font-size:20px;color:var(--pri);letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
.actions{display:flex;align-items:center;gap:6px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--sh)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer;transition:.15s}
.seg button.on{background:var(--pri);color:#fff}
.ico{border:0;background:var(--card);box-shadow:var(--sh);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.search-bar{display:flex;gap:8px}
.search{flex:1;padding:11px 15px;border:1px solid var(--line);border-radius:14px;background:var(--card);outline:none}
.search:focus,.in:focus,.sel:focus{border-color:var(--pri)}
.sel{padding:0 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:13px;font-weight:600;outline:none;cursor:pointer}
.live{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:11px 14px;margin:10px 0;box-shadow:var(--sh);font-weight:600;font-size:13.5px;gap:10px}
.sw{position:relative;display:inline-block;width:50px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#c5c9d3;border-radius:999px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:before{transform:translateX(22px)}
.sw.big{width:62px;height:34px}.sw.big span:before{width:28px;height:28px}.sw.big input:checked+span:before{transform:translateX(28px)}
.pills{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;align-items:center}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill.sub{font-size:12px;padding:5px 11px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform .15s;position:relative;display:flex;flex-direction:column}
.card:active{transform:scale(.98)}
.ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:54px;position:relative;background-size:cover;background-position:center}
.badge{position:absolute;top:8px;left:8px;background:var(--card);color:var(--tx);font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px;box-shadow:var(--sh)}
.badge.ok{color:#1a9c52}.badge.no{color:var(--err)}.badge.warn{color:var(--warn)}
.stk{position:absolute;bottom:8px;left:8px;background:rgba(15,17,23,.72);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px)}
.fav{position:absolute;top:8px;right:8px;border:0;background:var(--card);width:30px;height:30px;border-radius:50%;box-shadow:var(--sh);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:2}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.cb h3{margin:0 0 4px;font-size:14px;line-height:1.25}
.pr{font-weight:800;color:var(--pri);font-size:15px}
.loc{font-size:11.5px;color:var(--mut);margin-top:4px}
.pay-mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pay-mini span{font-size:10px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--mut);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:50px 10px;grid-column:1/-1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.48);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:540px;max-height:92vh;background:var(--card);border-radius:22px 22px 0 0;transform:translate(-50%,100%);transition:transform .28s;z-index:21;display:flex;flex-direction:column}
.sheet.on{transform:translate(-50%,0)}
.sbody{overflow-y:auto;padding:0 16px 14px}
.grab{width:42px;height:5px;background:var(--line);border-radius:9px;margin:10px auto;flex:none}
.big-ph{aspect-ratio:16/9;border-radius:16px;font-size:74px;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;position:relative}
.sbody h2{margin:12px 0 2px;font-size:20px}
.box{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:13.5px;line-height:1.55}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;margin:4px 4px 0 0;font-weight:600}
.qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:14px;padding:10px 14px;margin-top:12px}
.qty-ctrl{display:flex;align-items:center;gap:10px}
.qbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:800;cursor:pointer;font-size:16px}
.qbtn:disabled{opacity:.4;cursor:not-allowed}
.more-list{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.more-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px;gap:8px}
.cta{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;background:var(--pri);color:#fff;font-weight:700;padding:13px;border-radius:14px;cursor:pointer;font-size:14.5px}
.btn.wa{background:#25D366;color:#fff}.btn.ghost{background:var(--bg);color:var(--tx);border:1px dashed var(--mut)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px;width:auto;display:inline-block}
.btn.danger{background:rgba(214,48,49,.12);color:var(--err)}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px;margin-top:14px}
.panel h3{margin:0 0 10px;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.in{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none;margin-top:6px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.l{display:block;font-size:12.5px;font-weight:600;margin-top:11px;color:var(--mut)}
.inv{padding:12px 0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.inv:first-of-type{border-top:0}
.inv small{color:var(--mut)}
.inv-actions{display:flex;align-items:center;gap:6px;margin-top:6px}
.chip-btn{border:1px solid var(--line);background:var(--bg);padding:4px 9px;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer}
.chip-btn.del{color:var(--err);border-color:rgba(214,48,49,.3)}
.auth{max-width:400px;margin:6vh auto 0}
.auth .logo{font-size:30px;justify-content:center}
.auth p.s{text-align:center;color:var(--mut);margin:6px 0 16px;font-size:14px}
.err{color:var(--err);font-size:13px;margin-top:8px;min-height:18px}
.alert{background:rgba(243,156,18,.14);border:1px solid rgba(243,156,18,.4);color:var(--tx);padding:10px 12px;border-radius:12px;font-size:12.5px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:40;opacity:0;transition:.25s;pointer-events:none;font-weight:600;box-shadow:var(--sh)}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
const CATS=["Todo","Antojos / Comida","Perfumes y Belleza","Tecnología","Segunda Mano","Tutorías"];
const EMOJIS=["","🍪","🧴","💻","♻️","📚"];
const TINT=["","#FFE3C2","#F5D6F5","#D6E4FF","#E0F5D6","#FFF3B8"];
const DOMINIO=".edu.co";
const PAGOS=["Nequi","Daviplata","Efectivo"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Number(n||0).toLocaleString("es-CO");

function seed(){
  return{
    user:null,
    mode:"comprador",
    favs:[],
    sellers:[
      {id:1,n:"Laura M.",tel:"3001112233",on:true,ub:"Bloque B - Piso 2",h:"20:30",pago:["Nequi","Efectivo"]},
      {id:2,n:"Santiago R.",tel:"3002223344",on:true,ub:"Cafetería Central",h:"19:45",pago:["Nequi","Daviplata","Efectivo"]},
      {id:3,n:"Valeria P.",tel:"3003334455",on:false,ub:"",h:"",pago:["Nequi"]},
      {id:4,n:"Andrés G.",tel:"3004445566",on:true,ub:"Mesas del Bloque A",h:"21:00",pago:["Daviplata","Efectivo"]}
    ],
    products:[
      {id:1,sid:1,n:"Brownies con arequipe",p:5000,c:1,e:"🍫",d:"Brownie casero melcochudo con arequipe recién horneado.",ok:true,stock:8,clicks:14},
      {id:2,sid:1,n:"Torta de zanahoria (porción)",p:6000,c:1,e:"🍰",d:"Porción grande con frosting de queso crema y nueces.",ok:false,stock:0,clicks:9},
      {id:3,sid:2,n:"Empanadas de pipián x3",p:7000,c:1,e:"🥟",d:"Calienticas y crocantes, incluye ají casero de maní.",ok:true,stock:12,clicks:21},
      {id:4,sid:2,n:"Perfume árabe Lattafa 100ml",p:85000,c:2,e:"🧴",d:"Aroma dulce especiado de larga duración, caja sellada.",ok:true,stock:3,clicks:11},
      {id:5,sid:3,n:"Labial mate tono vino",p:12000,c:2,e:"💄",d:"Larga duración, no transfiere, totalmente nuevo.",ok:true,stock:5,clicks:4},
      {id:6,sid:4,n:"Cable USB-C carga rápida",p:15000,c:3,e:"🔌",d:"1 metro, trenzado en nylon resistente, soporta 60W.",ok:true,stock:6,clicks:7},
      {id:7,sid:4,n:"Mouse inalámbrico recargable",p:25000,c:4,e:"🖱️",d:"Silencioso, con receptor USB y Bluetooth, poco uso.",ok:true,stock:1,clicks:5},
      {id:8,sid:1,n:"Tutoría de Cálculo I / Lógica",p:20000,c:5,e:"📐",d:"Sesión personalizada de 1 hora, talleres y preparación de parciales.",ok:true,stock:4,clicks:6},
      {id:9,sid:2,n:"Audífonos Bluetooth TWS",p:35000,c:3,e:"🎧",d:"Batería de 6 horas continuas, estuche de carga rápida.",ok:true,stock:2,clicks:8}
    ]
  };
}

function readStore(key){
  try{return localStorage.getItem(key)}catch(e){return null}
}
function writeStore(key,value){
  try{localStorage.setItem(key,value);return true}catch(e){return false}
}

let S;
try{
  S=JSON.parse(readStore("unimarket"))||seed();
  if(!Array.isArray(S.sellers)||!Array.isArray(S.products))S=seed();
  if(!Array.isArray(S.favs))S.favs=[];
  S.products.forEach(p=>{if(p.stock===undefined)p.stock=10;if(p.clicks===undefined)p.clicks=0});
}catch(e){S=seed()}

const V={
  cat:0,
  q:"",
  solo:false,
  pago:"",
  favOnly:false,
  sort:"active",
  tab:"in",
  form:false,
  editId:null,
  confirmDel:null,
  cart:{},
  activePid:null,
  theme:readStore("unimarket_theme")||(window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")
};

function applyTheme(){
  document.documentElement.setAttribute("data-theme",V.theme);
  writeStore("unimarket_theme",V.theme);
}
applyTheme();

function toggleTheme(){
  V.theme=V.theme==="dark"?"light":"dark";
  applyTheme();
  render();
}

function save(){if(!writeStore("unimarket",JSON.stringify(S)))toast("No se pudo guardar. Usa una imagen más liviana.")}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove("on"),2100)}
const me=()=>S.sellers.find(s=>s.id==="me");
const seller=id=>S.sellers.find(s=>s.id===id);

/* Verifica si la hora límite del vendedor ya pasó hoy */
function isScheduleExpired(s){
  if(!s||!s.on||!s.h)return false;
  const [hh,mm]=s.h.split(":").map(Number);
  if(isNaN(hh)||isNaN(mm))return false;
  const now=new Date();
  const cur=now.getHours()*60+now.getMinutes();
  const lim=hh*60+mm;
  return cur>lim;
}

function isSellerActiveNow(s){
  return Boolean(s && s.on && !isScheduleExpired(s));
}

function isProductAvailable(p){
  return Boolean(p && p.ok && (p.stock===null || p.stock===undefined || p.stock>0));
}

/* ---------- Auth ---------- */
function renderAuth(){
  const reg=V.tab==="up";
  $("#app").innerHTML=`<div class="auth">
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button class="ico" id="th_btn" title="Cambiar tema">${V.theme==="dark"?"☀️":"🌙"}</button>
    </div>
    <div class="logo">UniMarket</div>
    <p class="s">Quién vende qué, y dónde, ahora mismo en tu campus.</p>
    <div class="panel">
      <div class="seg" style="width:100%;margin-bottom:8px">
        <button style="flex:1" class="${reg?"":"on"}" data-t="in">Entrar</button>
        <button style="flex:1" class="${reg?"on":""}" data-t="up">Registrarme</button>
      </div>
      ${reg?`<label class="l">Nombre y Apellido</label><input class="in" id="a_n" placeholder="Ej. Isabella Q.">
      <label class="l">WhatsApp (10 dígitos)</label><input class="in" id="a_t" inputmode="numeric" placeholder="3001234567">`:""}
      <label class="l">Correo institucional</label><input class="in" id="a_e" type="email" placeholder="tunombre@universidad${DOMINIO}">
      <label class="l">Contraseña</label><input class="in" id="a_p" type="password" placeholder="Mínimo 6 caracteres">
      <div class="err" id="err"></div>
      <button class="btn" id="go">${reg?"Crear cuenta":"Entrar al campus"}</button>
      <button class="btn ghost" id="demo" style="margin-top:8px">Explorar con cuenta Demo</button>
    </div>
  </div>`;
  $("#th_btn").onclick=toggleTheme;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{V.tab=b.dataset.t;renderAuth()});
  $("#demo").onclick=()=>{
    if(!me())S.sellers.push({id:"me",n:"Estudiante Demo",tel:"3001234567",on:true,ub:"Biblioteca - Piso 1",h:"21:30",pago:["Nequi","Efectivo"]});
    S.user={email:"estudiante@universidad"+DOMINIO,n:me().n};
    save();render();
  };
  $("#go").onclick=()=>{
    const e=$("#a_e").value.trim().toLowerCase(),p=$("#a_p").value,er=$("#err");
    if(!/^[^@\s]+@[^@\s]+$/.test(e)||!e.endsWith(DOMINIO)){er.textContent="Usa tu correo institucional terminado en "+DOMINIO;return}
    if(p.length<6){er.textContent="La contraseña debe tener mínimo 6 caracteres.";return}
    let n=e.split("@")[0];
    if(reg){
      n=$("#a_n").value.trim();
      const t=$("#a_t").value.replace(/\D/g,"");
      if(!n||t.length!==10){er.textContent="Escribe tu nombre y un WhatsApp válido de 10 dígitos.";return}
      if(!me())S.sellers.push({id:"me",n,tel:t,on:false,ub:"",h:"",pago:["Nequi","Efectivo"]});
      else{me().n=n;me().tel=t}
    }else if(!me()){
      S.sellers.push({id:"me",n,tel:"",on:false,ub:"",h:"",pago:["Nequi","Efectivo"]});
    }
    S.user={email:e,n:me()?me().n:n};save();render();
  };
}

/* ---------- Shell ---------- */
function render(){
  if(!S.user)return renderAuth();
  $("#app").innerHTML=`<header>
    <div class="top">
      <div class="logo">UniMarket</div>
      <div class="seg">
        <button data-m="comprador" class="${S.mode==="comprador"?"on":""}">Comprar</button>
        <button data-m="vendedor" class="${S.mode==="vendedor"?"on":""}">Vender</button>
      </div>
      <div class="actions">
        <button class="ico" id="th_btn" title="Cambiar tema">${V.theme==="dark"?"☀️":"🌙"}</button>
        <button class="ico" id="out" title="Cerrar sesión">⎋</button>
      </div>
    </div>
    ${S.mode==="comprador"?`<div class="search-bar">
      <input class="search" id="q" placeholder="Buscar brownies, perfumes, cables, vendedor..." value="${esc(V.q)}">
      <select class="sel" id="sort" title="Ordenar por">
        <option value="active" ${V.sort==="active"?"selected":""}>⚡ Activos</option>
        <option value="asc" ${V.sort==="asc"?"selected":""}>💲 Menor precio</option>
        <option value="desc" ${V.sort==="desc"?"selected":""}>💎 Mayor precio</option>
      </select>
    </div>`:""}
  </header><main id="main"></main>`;
  $("#th_btn").onclick=toggleTheme;
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();render()});
  $("#out").onclick=()=>{S.user=null;save();render()};
  S.mode==="comprador"?renderFeed():renderDash();
}

/* ---------- Feed del comprador ---------- */
function renderFeed(){
  $("#main").innerHTML=`
    <div class="live">
      <span>🟢 Mostrar solo vendedores activos en el campus</span>
      <label class="sw"><input type="checkbox" id="solo" ${V.solo?"checked":""}><span></span></label>
    </div>
    <div class="pills">
      <button class="pill ${V.favOnly?"on":""}" id="fav_filter">❤️ Favoritos (${S.favs.length})</button>
      ${CATS.map((c,i)=>`<button class="pill ${V.cat===i&&!V.favOnly?"on":""}" data-c="${i}">${c}</button>`).join("")}
    </div>
    <div class="pills" style="padding-top:0">
      <span style="font-size:12px;color:var(--mut);font-weight:600;margin-right:4px">Pago:</span>
      <button class="pill sub ${V.pago===""?"on":""}" data-pay="">Todos</button>
      ${PAGOS.map(pg=>`<button class="pill sub ${V.pago===pg?"on":""}" data-pay="${pg}">${pg}</button>`).join("")}
    </div>
    <div class="grid" id="grid"></div>`;

  $("#q").oninput=e=>{V.q=e.target.value;grid()};
  $("#sort").onchange=e=>{V.sort=e.target.value;grid()};
  $("#solo").onchange=e=>{V.solo=e.target.checked;grid()};
  $("#fav_filter").onclick=()=>{V.favOnly=!V.favOnly;renderFeed()};
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    V.favOnly=false;
    V.cat=+b.dataset.c;
    renderFeed();
  });
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{
    V.pago=b.dataset.pay;
    renderFeed();
  });
  grid();
}

function grid(){
  const q=V.q.toLowerCase().trim();
  const list=S.products.filter(p=>{
    const s=seller(p.sid);
    if(!s)return false;
    const active=isSellerActiveNow(s);
    if(V.favOnly && !S.favs.includes(p.id))return false;
    if(V.cat!==0 && p.c!==V.cat)return false;
    if(V.solo && !active)return false;
    if(V.pago && !s.pago.includes(V.pago))return false;
    if(q && !(p.n+" "+p.d+" "+s.n+" "+s.ub).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>{
    if(V.sort==="asc")return a.p-b.p;
    if(V.sort==="desc")return b.p-a.p;
    const sa=seller(a.sid),sb=seller(b.sid);
    return (isSellerActiveNow(sb)&&isProductAvailable(b))-(isSellerActiveNow(sa)&&isProductAvailable(a));
  });

  $("#grid").innerHTML=list.length?list.map(p=>{
    const s=seller(p.sid);
    const active=isSellerActiveNow(s);
    const expired=isScheduleExpired(s);
    const avail=isProductAvailable(p);
    const isFav=S.favs.includes(p.id);
    const b=!avail
      ?'<span class="badge no">Agotado</span>'
      :active
        ?'<span class="badge ok">🟢 Activo ahora</span>'
        :expired
          ?'<span class="badge warn">🕒 Horario vencido</span>'
          :'<span class="badge">⚪ Fuera del campus</span>';
    const stkBadge=avail && p.stock>0 && p.stock<=5?`<span class="stk">Quedan ${p.stock}</span>`:avail && p.stock>5?`<span class="stk">${p.stock} disp.</span>`:"";
    return `<div class="card" data-p="${p.id}" style="${!avail?"opacity:.65":""}">
      <div class="ph" style="${phStyle(p)}">
        ${p.img?"":p.e}
        ${b}
        ${stkBadge}
        <button class="fav" data-fav="${p.id}" title="Guardar en favoritos">${isFav?"❤️":"🤍"}</button>
      </div>
      <div class="cb">
        <h3>${esc(p.n)}</h3>
        <div class="pr">${money(p.p)}</div>
        <div class="loc">${active?"📍 "+esc(s.ub||"En el campus"):"👤 "+esc(s.n)}</div>
        <div class="pay-mini">${s.pago.map(x=>`<span>${x}</span>`).join("")}</div>
      </div>
    </div>`;
  }).join(""):'<div class="empty">😕 No encontramos productos con esos filtros.<br><small>Prueba cambiando la categoría o desactivando filtros.</small></div>';

  document.querySelectorAll("[data-fav]").forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const id=+btn.dataset.fav;
      if(S.favs.includes(id)){
        S.favs=S.favs.filter(x=>x!==id);
        toast("Quitado de favoritos");
      }else{
        S.favs.push(id);
        toast("Guardado en favoritos ❤️");
      }
      save();
      renderFeed();
    };
  });

  document.querySelectorAll("[data-p]").forEach(c=>c.onclick=()=>openSheet(+c.dataset.p));
}

function phStyle(p){return p.img?`background-image:url(${p.img})`:`background:${TINT[p.c]||"#eee"}`}

/* ---------- Bottom sheet (Detalle + Pedido múltiple por vendedor) ---------- */
function openSheet(id){
  V.activePid=id;
  const p=S.products.find(x=>x.id===id);
  if(!p)return;
  V.cart={[id]:isProductAvailable(p)?1:0};
  renderSheetContent();
  $("#ov").classList.add("on");
  $("#sheet").classList.add("on");
}

function renderSheetContent(){
  const p=S.products.find(x=>x.id===V.activePid);
  if(!p)return;
  const s=seller(p.sid);
  const active=isSellerActiveNow(s);
  const expired=isScheduleExpired(s);
  const avail=isProductAvailable(p);
  const others=S.products.filter(x=>x.sid===s.id && x.id!==p.id && isProductAvailable(x));

  const items=Object.entries(V.cart)
    .map(([pid,qty])=>({prod:S.products.find(x=>x.id==pid),qty}))
    .filter(x=>x.prod && x.qty>0);
  const total=items.reduce((acc,x)=>acc+x.prod.p*x.qty,0);

  const summaryTxt=items.map(x=>`• ${x.qty}x ${x.prod.n} (${money(x.prod.p*x.qty)})`).join("\n");
  const msg=`¡Hola ${s.n}! Vi tu catálogo en UniMarket (${s.ub||"campus"}).\nMe gustaría pedir:\n${summaryTxt}\n*Total: ${money(total)}*\n¿Todavía tienes disponibilidad?`;
  const link=s.tel?`https://wa.me/57${s.tel}?text=${encodeURIComponent(msg)}`:"";
  const maxStock=p.stock||20;
  const curQty=V.cart[p.id]||0;

  $("#sheet").innerHTML=`
    <div class="grab"></div>
    <div class="sbody">
      <div class="big-ph" style="${phStyle(p)}">${p.img?"":p.e}</div>
      <h2>${esc(p.n)}</h2>
      <div class="row" style="margin-top:4px">
        <div class="pr" style="font-size:21px">${money(p.p)}</div>
        <span style="font-size:12.5px;color:var(--mut);font-weight:600">${avail?`📦 ${p.stock} disponibles`:"❌ Agotado"}</span>
      </div>
      <p style="color:var(--mut);margin:8px 0 0;font-size:14px">${esc(p.d)}</p>

      ${avail?`<div class="qty-row">
        <div>
          <b style="font-size:13.5px">Cantidad a pedir</b><br>
          <small style="color:var(--mut)">Subtotal: ${money(p.p*curQty)}</small>
        </div>
        <div class="qty-ctrl">
          <button class="qbtn" data-q="-1" ${curQty<=1?"disabled":""}>−</button>
          <b style="min-width:20px;text-align:center">${curQty}</b>
          <button class="qbtn" data-q="1" ${curQty>=maxStock?"disabled":""}>+</button>
        </div>
      </div>`:""}

      ${others.length?`<div class="more-list">
        <b style="font-size:13px;color:var(--mut)">➕ Combina con otros productos de ${esc(s.n)}:</b>${others.map(o=>{
          const oq=V.cart[o.id]||0;
          return `<div class="more-item">
            <div>${o.e} <b>${esc(o.n)}</b> <span style="color:var(--pri);font-weight:700">${money(o.p)}</span></div>
            <div class="qty-ctrl">
              <button class="qbtn" style="width:26px;height:26px;font-size:14px" data-oq="${o.id}" data-d="-1" ${oq<=0?"disabled":""}>−</button>
              <span style="min-width:16px;text-align:center;font-weight:700">${oq}</span>
              <button class="qbtn" style="width:26px;height:26px;font-size:14px" data-oq="${o.id}" data-d="1" ${oq>=(o.stock||20)?"disabled":""}>+</button>
            </div>
          </div>`;
        }).join("")}
      </div>`:""}

      <div class="box">
        <b>👤 Vendedor: ${esc(s.n)}</b><br>
        <b>${active?"🟢 En el campus ahora":expired?"🕒 Horario finalizado hoy":"⚪ Fuera del campus"}</b><br>
        📍 ${s.on?esc(s.ub||"Ubicación por confirmar"):"Sin ubicación activa"}<br>
        🕒 ${s.on&&s.h?"Disponible hoy hasta las "+fmtH(s.h):"Sin horario registrado hoy"}<br>
        <div style="margin-top:4px">${s.pago.map(x=>`<span class="tag">💳 ${x}</span>`).join("")}</div>
      </div>
    </div>
    <div class="cta">
      ${avail && link && total>0
        ?`<a class="btn wa" id="wa_send" href="${link}" target="_blank" rel="noopener">Pedir por WhatsApp · ${money(total)}</a>`
        :`<button class="btn ghost" disabled>${!avail?"Producto agotado":"El vendedor aún no registró WhatsApp"}</button>`}
    </div>`;

  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.q;
    V.cart[p.id]=Math.max(1,Math.min(maxStock,(V.cart[p.id]||1)+d));
    renderSheetContent();
  });

  document.querySelectorAll("[data-oq]").forEach(b=>b.onclick=()=>{
    const oid=+b.dataset.oq,d=+b.dataset.d;
    const op=S.products.find(x=>x.id===oid);
    const lim=op?(op.stock||20):20;
    V.cart[oid]=Math.max(0,Math.min(lim,(V.cart[oid]||0)+d));
    renderSheetContent();
  });

  const waBtn=$("#wa_send");
  if(waBtn){
    waBtn.onclick=()=>{
      items.forEach(x=>{x.prod.clicks=(x.prod.clicks||0)+1});
      save();
    };
  }
}

function closeSheet(){$("#ov").classList.remove("on");$("#sheet").classList.remove("on")}
$("#ov").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function fmtH(h){if(!h)return"";const[a,b]=h.split(":").map(Number);return((a%12)||12)+":"+String(b).padStart(2,"0")+" "+(a>=12?"PM":"AM")}

/* ---------- Panel del vendedor (Con Edición, Eliminación, Stock y Métricas) ---------- */
function renderDash(){
  const m=me(),mine=S.products.filter(p=>p.sid==="me");
  const expired=isScheduleExpired(m);
  const editProd=V.editId?S.products.find(p=>p.id===V.editId):null;

  $("#main").innerHTML=`
    <div class="panel">
      <div class="row">
        <div>
          <h3 style="margin:0">¿Estás en la U hoy?</h3>
          <small style="color:var(--mut)">Hola, ${esc(m.n)}. Actívalo cuando llegues al campus.</small>
        </div>
        <label class="sw big"><input type="checkbox" id="on" ${m.on?"checked":""}><span></span></label>
      </div>

      ${expired?`<div class="alert">
        <span>⚠️ Tu hora límite (${fmtH(m.h)}) ya pasó y apareces inactivo.</span>
        <button class="chip-btn" id="ext_h">+2 horas</button>
      </div>`:""}

      <div id="fields" style="${m.on?"":"display:none"}">
        <div class="grid-2">
          <div>
            <label class="l">Ubicación actual en el campus</label>
            <input class="in" id="ub" placeholder="Ej. Mesas del Bloque A" value="${esc(m.ub)}">
          </div>
          <div>
            <label class="l">¿Hasta qué hora estarás?</label>
            <input class="in" id="h" type="time" value="${esc(m.h)}">
          </div>
        </div>
        <label class="l">Métodos de pago que recibes</label>
        <div>${PAGOS.map(x=>`<button class="pill ${m.pago.includes(x)?"on":""}" data-pg="${x}" style="margin:6px 6px 0 0">${x}</button>`).join("")}</div>
        <label class="l">Tu número de WhatsApp (10 dígitos)</label>
        <input class="in" id="tel" inputmode="numeric" placeholder="3001234567" value="${esc(m.tel)}">
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <h3 style="margin:0">Mi inventario (${mine.length})</h3>
        <button class="btn sm" id="add">${V.form?"✕ Cerrar formulario":"＋ Nuevo producto"}</button>
      </div>

      <div id="form" style="${V.form?"":"display:none"};background:var(--bg);padding:14px;border-radius:14px;margin:12px 0">
        <h4 style="margin:0 0 6px;font-size:14.5px">${editProd?"✏️ Editar producto":"➕ Agregar producto al catálogo"}</h4>
        <label class="l">Foto del producto (opcional)</label>
        <input class="in" type="file" accept="image/*" id="f_i" style="background:var(--card)">
        <div class="grid-2">
          <div>
            <label class="l">Nombre del producto</label>
            <input class="in" id="f_n" style="background:var(--card)" placeholder="Ej. Galletas con chips" value="${esc(editProd?editProd.n:"")}">
          </div>
          <div>
            <label class="l">Precio (COP)</label>
            <input class="in" id="f_p" style="background:var(--card)" inputmode="numeric" placeholder="5000" value="${editProd?editProd.p:""}">
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label class="l">Categoría</label>
            <select class="in" id="f_c" style="background:var(--card)">
              ${CATS.slice(1).map((c,i)=>`<option value="${i+1}" ${editProd&&editProd.c===i+1?"selected":""}>${c}</option>`).join("")}
            </select>
          </div>
          <div>
            <label class="l">Unidades disponibles (Stock)</label>
            <input class="in" id="f_st" style="background:var(--card)" type="number" min="0" max="999" placeholder="10" value="${editProd?editProd.stock:10}">
          </div>
        </div>
        <label class="l">Descripción corta</label>
        <textarea class="in" id="f_d" style="background:var(--card)" rows="2" maxlength="140" placeholder="Ingredientes, estado o detalles clave...">${esc(editProd?editProd.d:"")}</textarea>
        <div class="err" id="ferr"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" id="f_s">${editProd?"Guardar cambios":"Publicar producto"}</button>
          ${editProd?`<button class="btn ghost" id="f_cancel" style="width:auto;padding:0 16px">Cancelar</button>`:""}
        </div>
      </div>

      ${mine.length?mine.map(p=>`<div class="inv">
        <div style="flex:1">
          <b>${p.e}${esc(p.n)}</b> <span style="color:var(--pri);font-weight:700">${money(p.p)}</span><br>
          <small>${CATS[p.c]} · 📦 Stock: <b>${p.stock??0}</b> · 🔥 ${p.clicks||0} interesados en WhatsApp</small>
          <div class="inv-actions">
            <button class="chip-btn" data-st="${p.id}" data-d="-1">−1 stock</button>
            <button class="chip-btn" data-st="${p.id}" data-d="1">+1 stock</button>
            <button class="chip-btn" data-ed="${p.id}">✏️ Editar</button>
            ${V.confirmDel===p.id
              ?`<button class="chip-btn del" data-del-ok="${p.id}">¿Confirmar borrar?</button>
                <button class="chip-btn" data-del-no="${p.id}">Cancelar</button>`
              :`<button class="chip-btn del" data-del="${p.id}">🗑️ Borrar</button>`}
          </div>
        </div>
        <div style="text-align:right">
          <label class="sw"><input type="checkbox" data-ok="${p.id}" ${isProductAvailable(p)?"checked":""}><span></span></label><br>
          <small>${isProductAvailable(p)?"Disponible":"Agotado"}</small>
        </div>
      </div>`).join(""):'<p style="color:var(--mut);text-align:center;padding:18px 0">Aún no tienes productos publicados. ¡Usa el botón "＋ Nuevo producto"!</p>'}
    </div>`;

  $("#on").onchange=e=>{
    m.on=e.target.checked;
    save();
    toast(m.on?"Ahora apareces activo en el campus 🟢":"Saliste del campus");
    renderDash();
  };

  const extBtn=$("#ext_h");
  if(extBtn){
    extBtn.onclick=()=>{
      const now=new Date();
      now.setHours(now.getHours()+2);
      m.h=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
      save();
      toast("Horario extendido hasta las "+fmtH(m.h));
      renderDash();
    };
  }

  const up=(id,k)=>{
    const e=$("#"+id);
    if(e)e.oninput=()=>{m[k]=e.value.trim();save()};
  };
  up("ub","ub");
  const hIn=$("#h");
  if(hIn)hIn.onchange=()=>{m.h=hIn.value;save();renderDash()};

  const telInput=$("#tel");
  if(telInput){
    telInput.oninput=e=>{m.tel=e.target.value.replace(/\D/g,"");save()};
  }

  document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{
    const x=b.dataset.pg;
    m.pago=m.pago.includes(x)?m.pago.filter(y=>y!==x):[...m.pago,x];
    b.classList.toggle("on");
    save();
  });

  document.querySelectorAll("[data-ok]").forEach(c=>c.onchange=()=>{
    const prod=S.products.find(p=>p.id==c.dataset.ok);
    if(prod){
      prod.ok=c.checked;
      if(c.checked && (!prod.stock || prod.stock<=0))prod.stock=1;
      save();
      renderDash();
    }
  });

  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
    const prod=S.products.find(p=>p.id==b.dataset.st);
    if(prod){
      prod.stock=Math.max(0,(prod.stock||0)+(+b.dataset.d));
      prod.ok=prod.stock>0;
      save();
      renderDash();
    }
  });

  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{
    V.editId=+b.dataset.ed;
    V.form=true;
    renderDash();
  });

  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    V.confirmDel=+b.dataset.del;
    renderDash();
  });
  document.querySelectorAll("[data-del-no]").forEach(b=>b.onclick=()=>{
    V.confirmDel=null;
    renderDash();
  });
  document.querySelectorAll("[data-del-ok]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.delOk;
    S.products=S.products.filter(p=>p.id!==id);
    V.confirmDel=null;
    save();
    toast("Producto eliminado 🗑️");
    renderDash();
  });

  $("#add").onclick=()=>{
    V.editId=null;
    V.form=!V.form;
    renderDash();
  };

  const cancelBtn=$("#f_cancel");
  if(cancelBtn)cancelBtn.onclick=()=>{V.editId=null;V.form=false;renderDash()};

  let img=editProd?editProd.img||"":"";
  let imageIsProcessing=false;
  const saveProductBtn=$("#f_s");
  $("#f_i").onchange=e=>{
    const f=e.target.files[0];
    if(!f)return;
    imageIsProcessing=true;
    saveProductBtn.disabled=true;
    saveProductBtn.textContent="Procesando foto...";
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement("canvas"),k=Math.min(1,480/Math.max(im.width,im.height));
        c.width=im.width*k;c.height=im.height*k;
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        img=c.toDataURL("image/jpeg",.72);
        imageIsProcessing=false;
        saveProductBtn.disabled=false;
        saveProductBtn.textContent=editProd?"Guardar cambios":"Publicar producto";
        toast("Foto lista para publicar ✅");
      };
      im.onerror=()=>{
        imageIsProcessing=false;
        saveProductBtn.disabled=false;
        saveProductBtn.textContent=editProd?"Guardar cambios":"Publicar producto";
        $("#ferr").textContent="No pudimos procesar esa imagen. Prueba con otro archivo.";
      };
      im.src=r.result;
    };
    r.onerror=()=>{
      imageIsProcessing=false;
      saveProductBtn.disabled=false;
      saveProductBtn.textContent=editProd?"Guardar cambios":"Publicar producto";
      $("#ferr").textContent="No pudimos leer esa imagen. Prueba con otro archivo.";
    };
    r.readAsDataURL(f);
  };

  saveProductBtn.onclick=()=>{
    if(imageIsProcessing){$("#ferr").textContent="Espera a que termine de procesarse la foto.";return}
    const n=$("#f_n").value.trim();
    const pr=parseInt(String($("#f_p").value).replace(/\D/g,""),10);
    const st=Math.max(0,parseInt($("#f_st").value,10)||0);
    if(!n||!pr){$("#ferr").textContent="Completa el nombre y un precio válido.";return}
    const c=+$("#f_c").value;
    const desc=$("#f_d").value.trim()||"Sin descripción.";

    if(editProd){
      editProd.n=n;
      editProd.p=pr;
      editProd.c=c;
      editProd.e=EMOJIS[c];
      editProd.d=desc;
      editProd.stock=st;
      editProd.ok=st>0;
      if(img)editProd.img=img;
      toast("Producto actualizado ✅");
    }else{
      S.products.push({
        id:Date.now(),
        sid:"me",
        n,
        p:pr,
        c,
        e:EMOJIS[c],
        d:desc,
        ok:st>0,
        stock:st,
        clicks:0,
        img
      });
      toast("Producto publicado ✅");
    }
    V.form=false;
    V.editId=null;
    save();
    renderDash();
  };
}

render();
</script>
</body>
</html>
